<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <title>404 | Page Not Found</title>
  <style>
    html,body{min-height:100%;margin:0}
    body{display:grid;place-items:center;background:#fff;color:#171717;font-family:Arial,Helvetica,sans-serif}
    .box{width:min(680px,calc(100% - 40px));padding:70px 0;text-align:center}
    .code{font-size:clamp(5rem,18vw,11rem);font-weight:800;line-height:.8;letter-spacing:-.08em}
    .box h1{margin:30px 0 10px;font-size:1.45rem}
    .box p{color:#666}
    .cipher{position:fixed;right:10px;bottom:9px;left:10px;overflow-wrap:anywhere;color:#b5b5b5;text-align:center;font:10px/1.35 monospace;letter-spacing:.08em;user-select:text}
    @media(max-width:500px){.cipher{right:7px;bottom:7px;left:7px;font-size:8px;line-height:1.3}}
  </style>
</head>
<body>
  <main class="box">
    <div class="code">404</div>
    <h1>Page not found</h1>
    <p>The requested page may have moved or no longer exists.</p>
  </main>
  <div class="cipher" aria-label="unindexed footer data">46 46 46 . 14 41 14 42 14 23 25 12 41 34 12 42 24 23 34 23 14 51 21 22 . 31 16 42 / 15 / 26 45 16 12 32</div>
</body>
</html>
